<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Promemoria</title>
<meta name="description" content="My planner: reminders, daily activities and goals.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Promemoria">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10171A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column; sticky date header, fixed bottom tab bar, bottom-sheet editor. */
:root{
  --bg:#EDF1EC; --surface:#FFFFFF; --surface-2:#F5F8F4; --ink:#15232A; --muted:#5B6966; --line:#D6DDD4;
  --accent:#1D5C63; --accent-ink:#FFFFFF; --accent-soft:#DCEBEA;
  --rem:#B4561A; --rem-soft:#F6E4D5;
  --act:#2B5DB5; --act-soft:#DFE7F6;
  --goal:#7A3C95; --goal-soft:#EEE1F3;
  --ok:#2E7A3D; --warn:#9A6200; --bad:#B0302A;
  --shadow:0 10px 30px rgba(21,35,42,.14);
  --f-display:"Bricolage Grotesque", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-body:"Manrope", -apple-system, "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#10171A; --surface:#1A2428; --surface-2:#141C1F; --ink:#E5ECE9; --muted:#9AA8A4; --line:#2A373B;
  --accent:#62B6B4; --accent-ink:#0B1A1B; --accent-soft:#1D3436;
  --rem:#F0A067; --rem-soft:#3A2A1D; --act:#92B3F3; --act-soft:#1E2A42; --goal:#CC9DE2; --goal-soft:#32233A;
  --ok:#7DCB8B; --warn:#E5B552; --bad:#F2897E; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg); margin:0}
body{color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.wrap{max-width:600px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top,0px)}
.top .wrap{padding-block:12px 10px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px}
.brand{font-family:var(--f-display); font-weight:700; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent)}
.today-line{font-family:var(--f-display); font-weight:700; font-size:22px; line-height:1.15; text-wrap:balance}
.status{font-size:12px; color:var(--muted); text-align:right; min-width:0}
.status b{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--ok); margin-right:6px; vertical-align:1px}

main{padding-block:16px calc(130px + env(safe-area-inset-bottom,0px))}
.view{display:flex; flex-direction:column; gap:22px}
h2{font-family:var(--f-display); font-weight:700; font-size:19px; margin:0; text-wrap:balance}
h3{font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0}
.sec{display:flex; flex-direction:column; gap:10px}
.sec-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
p{margin:0}

/* banner */
.banner{background:var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius:14px; padding:12px 14px; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.banner p{min-width:0; flex:1 1 220px}

/* buttons */
.btn{border:0; border-radius:999px; padding:9px 16px; font-weight:700; background:var(--accent); color:var(--accent-ink); white-space:nowrap}
.btn.ghost{background:transparent; color:var(--accent); border:1px solid var(--line)}
.btn.danger{background:var(--bad); color:var(--surface)}
.btn.sm{padding:6px 12px; font-size:13px}
.btn:disabled{opacity:.55; cursor:default}
.link{background:none; border:0; padding:0; color:var(--accent); font-weight:700; text-decoration:underline; text-underline-offset:3px}

/* list rows */
.list{background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden}
.row{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; padding:12px 14px; border-top:1px solid var(--line); width:100%; text-align:left; background:none; border-left:0; border-right:0; border-bottom:0}
.row:first-child{border-top:0}
.row.dim{opacity:.55}
.row .main{min-width:0}
.row .t{font-weight:700; overflow-wrap:anywhere}
.row .s{font-size:13px; color:var(--muted); overflow-wrap:anywhere}
.when{width:52px; text-align:center; border-radius:10px; padding:5px 0; line-height:1.1}
.when .d{font-family:var(--f-display); font-weight:700; font-size:20px}
.when .m{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase}
.when.rem{background:var(--rem-soft); color:var(--rem)}
.when.act{background:var(--act-soft); color:var(--act)}
.when .tm{font-family:var(--f-display); font-weight:700; font-size:15px}
.right{display:flex; flex-direction:column; align-items:flex-end; gap:4px; font-size:12px; color:var(--muted); text-align:right}
.empty{padding:18px 14px; color:var(--muted); font-size:14px}

.chip{display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:2px 9px; font-size:12px; font-weight:700; white-space:nowrap}
.chip.rem{background:var(--rem-soft); color:var(--rem)}
.chip.act{background:var(--act-soft); color:var(--act)}
.chip.goal{background:var(--goal-soft); color:var(--goal)}
.chip.ok{background:color-mix(in srgb, var(--ok) 15%, transparent); color:var(--ok)}
.chip.warn{background:color-mix(in srgb, var(--warn) 16%, transparent); color:var(--warn)}
.chip.bad{background:color-mix(in srgb, var(--bad) 14%, transparent); color:var(--bad)}
.chip.plain{background:var(--surface-2); color:var(--muted); border:1px solid var(--line)}

.check{width:30px; height:30px; border-radius:50%; border:2px solid var(--act); background:transparent; display:grid; place-items:center; color:var(--accent-ink); flex:none; padding:0}
.check[aria-pressed="true"]{background:var(--act); color:var(--surface)}
.check:disabled{opacity:.35; cursor:default}
.check svg{width:16px; height:16px; opacity:0}
.check[aria-pressed="true"] svg{opacity:1}
.daybar{display:flex; flex-direction:column; gap:10px}
.pick{display:flex; gap:8px; align-items:flex-end}
.pick > input, .pick > .f{flex:1 1 0; min-width:0}
.nav{width:44px; height:44px; flex:none; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:22px; line-height:1; padding:0}
.day-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px}

.days{display:flex; gap:3px; flex-wrap:wrap}
.days i{font-style:normal; font-size:10px; font-weight:700; width:20px; height:20px; border-radius:6px; display:grid; place-items:center; background:var(--surface-2); color:var(--muted); border:1px solid var(--line)}
.days i.on{background:var(--act-soft); color:var(--act); border-color:transparent}

/* goal cards */
.goal-card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:10px}
.goal-top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start}
.goal-top .t{font-family:var(--f-display); font-weight:700; font-size:18px; overflow-wrap:anywhere; min-width:0}
.goal-meta{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; color:var(--muted)}
.goal-meta b{color:var(--ink)}

/* inputs */
label.f, .f{display:flex; flex-direction:column; gap:5px; font-size:13px; font-weight:700; color:var(--muted); min-width:0}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:16px; color:var(--ink); min-width:0; min-height:44px; -webkit-appearance:none; appearance:none}
textarea{min-height:64px; resize:vertical}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.seg{display:grid; grid-template-columns:repeat(3,1fr); background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:3px; gap:3px}
.seg button{border:0; background:none; border-radius:9px; padding:8px 4px; font-weight:700; font-size:14px; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12)}
.toggles{display:flex; flex-wrap:wrap; gap:6px}
.toggles button{border:1px solid var(--line); background:var(--surface-2); border-radius:999px; padding:6px 11px; font-size:13px; font-weight:700; color:var(--muted)}
.toggles button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.calbox{display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:13px}
.calbox p{flex:1 1 200px; min-width:0}
.err-msg{color:var(--bad); font-size:13px; font-weight:700}

/* tabs + fab */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid; grid-template-columns:repeat(5,1fr)}
.tabs button{border:0; background:none; padding:8px 2px 9px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; font-weight:700; color:var(--muted)}
.tabs svg{width:22px; height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}
.fab{position:fixed; z-index:26; right:max(18px, calc(env(safe-area-inset-right,0px) + 18px)); bottom:calc(74px + env(safe-area-inset-bottom,0px)); width:56px; height:56px; border-radius:18px; border:0; background:var(--accent); color:var(--accent-ink); box-shadow:var(--shadow); display:grid; place-items:center; padding:0}
.fab svg{width:26px; height:26px}
@media (min-width:640px){ .fab{right:calc(50% - 300px + 18px)} }

/* sheet */
.backdrop{position:fixed; inset:0; z-index:40; background:rgba(8,14,16,.45); display:flex; align-items:flex-end; justify-content:center}
.sheet{background:var(--surface); width:100%; max-width:600px; max-height:92%; overflow-y:auto; -webkit-overflow-scrolling:touch; border-radius:20px 20px 0 0; box-shadow:var(--shadow); padding:18px max(16px, env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px)); display:flex; flex-direction:column; gap:14px}
.sheet-head{display:flex; justify-content:space-between; align-items:center; gap:10px}
.sheet-actions{display:flex; gap:8px; flex-wrap:wrap; justify-content:space-between; align-items:center; padding-top:4px}
.sheet-actions .grp{display:flex; gap:8px}
.x{border:0; background:var(--surface-2); width:34px; height:34px; border-radius:50%; font-size:18px; color:var(--muted); padding:0}

/* report */
.filters{display:flex; flex-direction:column; gap:10px}
.report{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:18px}
.report-head{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:flex-end; border-bottom:2px solid var(--ink); padding-bottom:10px}
.report-head .ttl{font-family:var(--f-display); font-weight:700; font-size:22px; line-height:1.1}
.sum{display:flex; flex-wrap:wrap; gap:8px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:13px}
th{text-align:left; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700; padding:6px 8px 6px 0; border-bottom:1px solid var(--line); white-space:nowrap}
td{padding:9px 8px 9px 0; border-bottom:1px solid var(--line); vertical-align:top}
tr:last-child td{border-bottom:0}
td .t{font-weight:700}
.minibar{width:70px; height:6px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden; margin-top:4px}
.minibar span{display:block; height:100%; background:var(--act)}
.backup{display:flex; flex-direction:column; gap:10px; border-top:1px solid var(--line); padding-top:18px}
.backup .grp{display:flex; gap:8px; flex-wrap:wrap}

.toast{position:fixed; z-index:50; left:50%; transform:translateX(-50%); bottom:calc(140px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:12px; font-size:14px; font-weight:600; width:max-content; max-width:min(92vw,520px); box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .22s ease-out} @keyframes up{from{transform:translateY(24px); opacity:.6}} }
@media (max-width:380px){ .grid2{grid-template-columns:1fr} }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div>
      <div class="brand">Promemoria</div>
      <div class="today-line" id="todayLine">Today</div>
    </div>
    <div class="status" id="status"><b></b>Saved on this phone</div>
  </div>
</header>

<main class="wrap" id="main" aria-live="polite"></main>

<button class="fab" id="fab" aria-label="Add new item" data-act="new">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabs" aria-label="Sections">
  <div class="wrap">
    <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><circle cx="12" cy="15" r="2"/></svg>Today</button>
    <button data-tab="reminders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4"/></svg>Reminders</button>
    <button data-tab="activities"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Activities</button>
    <button data-tab="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg>Goals</button>
    <button data-tab="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7M9 8h3"/></svg>Report</button>
  </div>
</nav>

<div class="backdrop" id="backdrop" hidden>
  <form class="sheet" id="sheet" novalidate>
    <div class="sheet-head">
      <h2 id="sheetTitle">New item</h2>
      <button type="button" class="x" data-act="close" aria-label="Close">×</button>
    </div>
    <div class="seg" id="typeSeg" role="group" aria-label="Type">
      <button type="button" data-type="reminder">Reminder</button>
      <button type="button" data-type="activity">Activity</button>
      <button type="button" data-type="goal">Goal</button>
    </div>
    <label class="f">Title<input type="text" id="fTitle" maxlength="120" placeholder="e.g. University, Morning run, Save €5,000"></label>

    <div id="fsReminder" class="sec">
      <div class="grid2">
        <label class="f">Date<input type="date" id="fDate"></label>
        <label class="f">Time (optional)<input type="time" id="fTime"></label>
      </div>
      <label class="f">Repeats
        <select id="fRepeat">
          <option value="none">Does not repeat</option>
          <option value="weekly">Every week</option>
          <option value="monthly">Every month</option>
          <option value="yearly">Every year (birthdays)</option>
        </select>
      </label>
    </div>

    <div id="fsActivity" class="sec">
      <div class="grid2">
        <label class="f">Starts<input type="time" id="fStart"></label>
        <label class="f">Ends (optional)<input type="time" id="fEnd"></label>
      </div>
      <div class="f">Repeat on
        <div class="toggles" id="fDays" role="group" aria-label="Days of the week"></div>
        <span class="muted small" style="font-weight:500">Pick no days for a one-time activity.</span>
      </div>
      <label class="f" id="fActDateWrap">Date (one time)<input type="date" id="fActDate"></label>
    </div>

    <div id="fsGoal" class="sec">
      <div class="grid2">
        <label class="f">From<input type="date" id="fGStart"></label>
        <label class="f">Deadline<input type="date" id="fDeadline"></label>
      </div>
    </div>

    <div class="sec">
      <h3 id="alertsLabel">Alert me</h3>
      <div class="toggles" id="fAlerts" role="group" aria-label="Alerts"></div>
    </div>

    <label class="f">Notes<textarea id="fNotes" maxlength="1000" placeholder="Room number, what to bring, why this matters…"></textarea></label>

    <div class="calbox" id="calBox" hidden>
      <p id="calText"></p>
      <button type="button" class="btn sm" data-act="calone">Add to Calendar</button>
    </div>

    <div class="err-msg" id="formErr" hidden></div>

    <div class="sheet-actions">
      <button type="button" class="btn ghost" id="delBtn" data-act="delete">Delete</button>
      <div class="grp">
        <button type="button" class="btn ghost" data-act="close">Cancel</button>
        <button type="submit" class="btn" id="saveBtn">Save</button>
      </div>
    </div>
  </form>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
"use strict";
const LS_KEY = "promemoria.items.v1";
const DOW_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DOW_LETTER = ["S","M","T","W","T","F","S"];
const RRULE_DAY = ["SU","MO","TU","WE","TH","FR","SA"];
const WEEK_ORDER = [1,2,3,4,5,6,0];
const TIMED_ALERTS = [[0,"At start"],[5,"5 min before"],[10,"10 min"],[15,"15 min"],[30,"30 min"],[60,"1 hour"],[120,"2 hours"],[1440,"1 day"],[2880,"2 days"],[10080,"1 week"]];
const DAY_ALERTS = [[1,"1 day before"],[2,"2 days"],[7,"1 week"],[14,"2 weeks"],[28,"4 weeks"]];
const TYPE = {
  reminder:{label:"Reminder"},
  activity:{label:"Activity"},
  goal:{label:"Goal"}
};
const VIEWS = ["today","reminders","activities","goals","report"];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { if(!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const today0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const daysBetween = (a,b) => Math.round((b - a) / 86400000);
const mins = t => { if(!t) return null; const [h,m] = t.split(":").map(Number); return h*60+m; };
const fmtDate = (d, opts={weekday:"short", day:"numeric", month:"short"}) => d.toLocaleDateString("en-GB", opts);
const fmtLong = d => d.toLocaleDateString("en-GB", {day:"numeric", month:"short", year:"numeric"});
const uid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36)+Math.random().toString(36).slice(2))).replace(/[^A-Za-z0-9-]/g,"");
const clone = o => JSON.parse(JSON.stringify(o));
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

function relDays(n){
  if(n === 0) return "today";
  if(n === 1) return "tomorrow";
  if(n === -1) return "yesterday";
  return n > 0 ? `in ${n} days` : `${-n} days ago`;
}
function alertText(it){
  const allDay = isAllDay(it);
  const list = (it.alerts||[]).slice().sort((a,b)=>b-a);
  if(!list.length) return "No alerts";
  const src = allDay ? DAY_ALERTS : TIMED_ALERTS;
  return list.map(v => { const f = src.find(x => x[0] === v); let t = f ? f[1] : String(v); if(v > 0 && !t.includes("before")) t += " before"; return t; }).join(", ") + (allDay ? " (9:00)" : "");
}
function daysText(days){
  const s = new Set(days||[]);
  if(s.size === 7) return "Every day";
  if(s.size === 5 && [1,2,3,4,5].every(d=>s.has(d))) return "Weekdays";
  if(s.size === 2 && s.has(0) && s.has(6)) return "Weekends";
  return WEEK_ORDER.filter(d=>s.has(d)).map(d=>DOW_SHORT[d]).join(", ") || "No days";
}
const isOnce = it => !(it.days||[]).length;
function schedText(it){
  if(!isOnce(it)) return daysText(it.days);
  const d = parseYmd(it.date);
  return d ? "Once · " + fmtDate(d) : "Once";
}
function timeSpan(it){ return it.end ? `${it.start}–${it.end}` : it.start; }
function durMin(it){ const a = mins(it.start), b = mins(it.end); if(a==null || b==null) return 0; return b > a ? b - a : 0; }
const isAllDay = it => it.type === "goal" || (it.type === "reminder" && !it.time);

/* ---------- occurrences ---------- */
function occ(base, rep, k){
  if(rep === "weekly") return addDays(base, 7*k);
  const m0 = base.getMonth() + (rep === "monthly" ? k : 0);
  const y = base.getFullYear() + (rep === "yearly" ? k : 0) + Math.floor(m0/12);
  const m = ((m0 % 12) + 12) % 12;
  const last = new Date(y, m+1, 0).getDate();
  return new Date(y, m, Math.min(base.getDate(), last));
}
function remOccurrences(it, from, to, limit=500){
  const base = parseYmd(it.date); if(!base) return [];
  if(!it.repeat || it.repeat === "none") return (base >= from && (!to || base <= to)) ? [base] : [];
  const out = [];
  for(let k=0; k<4000 && out.length<limit; k++){
    const d = occ(base, it.repeat, k);
    if(to && d > to) break;
    if(d >= from) out.push(d);
  }
  return out;
}
const nextRem = it => remOccurrences(it, today0(), null, 1)[0] || null;
const actOn = (it, d) => isOnce(it) ? it.date === ymd(d) : it.days.includes(d.getDay());
function nextActDate(it){ if(isOnce(it)) return parseYmd(it.date) || today0(); const t = today0(); for(let i=0;i<7;i++){ const d = addDays(t,i); if(actOn(it,d)) return d; } return t; }

function goalStats(g){
  const t = today0();
  const start = parseYmd(g.start) || parseYmd(g.created) || t;
  const end = parseYmd(g.deadline) || t;
  const left = daysBetween(t, end);
  let status;
  if(g.done) status = ["Achieved","ok"];
  else if(left < 0) status = ["Overdue","bad"];
  else if(left <= 14) status = ["Due soon","warn"];
  else status = ["In progress","plain"];
  return {start, end, left, status};
}

/* ---------- state + storage (on this phone) ---------- */
let items = [];
let view = "today";
let report = {type:"all", days:30};
let dmode = "day";
let selDay = ymd(today0());
let rFrom = ymd(today0()), rTo = ymd(addDays(today0(), 6));
let storageOk = true;

function load(){
  try { const s = localStorage.getItem(LS_KEY); items = s ? JSON.parse(s) : []; if(!Array.isArray(items)) items = []; }
  catch(e){ items = []; storageOk = false; }
  try { const r = JSON.parse(localStorage.getItem("promemoria.report")||"null"); if(r && r.type) report = r; } catch(e){}
}
function persist(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(items)); storageOk = true; }
  catch(e){ storageOk = false; toast("Couldn't save on this phone. Is Private Browsing on? Turn it off and try again.", 6000); }
}
function putItem(it){
  it.updated = Date.now();
  const i = items.findIndex(x => x.id === it.id);
  if(i >= 0) items[i] = it; else items.push(it);
  persist(); render();
}
function dropItem(id){ items = items.filter(x => x.id !== id); persist(); render(); }

function toast(msg, ms=3200){
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.hidden = true; }, ms);
}

/* ---------- iPhone Calendar (.ics) ---------- */
function icsEscape(s){ return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n"); }
function fold(line){
  // RFC 5545: lines over 75 octets are folded; fold by characters, conservatively.
  const out = []; let s = line;
  while(s.length > 70){ out.push(s.slice(0,70)); s = " " + s.slice(70); }
  out.push(s); return out.join("\r\n");
}
const icsDate = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
function icsDateTime(d, t){ const [h,m] = t.split(":").map(Number); const x = new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m); return `${icsDate(x)}T${pad(x.getHours())}${pad(x.getMinutes())}00`; }
function eventFor(it){
  let ev = {uid: it.id + "@promemoria", summary: it.title, notes: it.notes || ""};
  if(it.type === "reminder"){
    const d = parseYmd(it.date) || today0();
    if(it.time){ ev.start = icsDateTime(d, it.time); ev.end = icsDateTime(d, plusTime(it.time, 30)); ev.endNextDay = mins(it.time) + 30 >= 1440; ev.day = d; }
    else { ev.allDay = true; ev.start = icsDate(d); ev.end = icsDate(addDays(d,1)); }
    if(it.repeat && it.repeat !== "none") ev.rrule = `FREQ=${it.repeat.toUpperCase()}`;
  } else if(it.type === "activity"){
    const d = nextActDate(it);
    const dur = durMin(it) || 30;
    ev.start = icsDateTime(d, it.start); ev.end = icsDateTime(d, plusTime(it.start, dur)); ev.endNextDay = mins(it.start) + dur >= 1440; ev.day = d;
    const days = it.days || [];
    ev.rrule = !days.length ? "" : days.length === 7 ? "FREQ=DAILY" : `FREQ=WEEKLY;BYDAY=${WEEK_ORDER.filter(x=>days.includes(x)).map(x=>RRULE_DAY[x]).join(",")}`;
  } else {
    const d = parseYmd(it.deadline) || today0();
    ev.summary = `Goal deadline: ${it.title}`;
    ev.allDay = true; ev.start = icsDate(d); ev.end = icsDate(addDays(d,1));
  }
  if(ev.endNextDay){ const [h,m] = ev.end.slice(9,13).match(/../g); ev.end = icsDate(addDays(ev.day,1)) + `T${h}${m}00`; }
  // all-day alerts fire at 9:00 on the chosen day before: N days before midnight + 15 h
  ev.alarms = (it.alerts||[]).map(v => ev.allDay ? Math.max(0, v*1440 - 540) : v);
  return ev;
}
function plusTime(t, add){ const m = (mins(t) + add) % 1440; return `${pad(Math.floor(m/60))}:${pad(m%60)}`; }
// What the Calendar event depends on (not today's date), so an unchanged item stays "In Calendar".
const SIG_FIELDS = {reminder:["title","notes","date","time","repeat","alerts"], activity:["title","notes","start","end","days","date","alerts"], goal:["title","notes","deadline","alerts"]};
const eventSig = it => JSON.stringify((SIG_FIELDS[it.type]||[]).map(k => it[k] ?? ""));
const calState = it => (it.cal && it.cal.sig === eventSig(it)) ? "in" : "pending";

function buildIcs(list){
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Promemoria//Planner//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Promemoria"];
  for(const it of list){
    const ev = eventFor(it);
    const seq = (it.cal && it.cal.seq != null) ? it.cal.seq + 1 : 0;
    L.push("BEGIN:VEVENT", `UID:${ev.uid}`, `DTSTAMP:${stamp}`, `SEQUENCE:${seq}`, fold(`SUMMARY:${icsEscape(ev.summary)}`));
    if(ev.allDay){ L.push(`DTSTART;VALUE=DATE:${ev.start}`, `DTEND;VALUE=DATE:${ev.end}`, "TRANSP:TRANSPARENT"); }
    else { L.push(`DTSTART:${ev.start}`, `DTEND:${ev.end}`); }
    if(ev.rrule) L.push(`RRULE:${ev.rrule}`);
    const desc = [ev.notes, "Added from Promemoria"].filter(Boolean).join("\n\n");
    L.push(fold(`DESCRIPTION:${icsEscape(desc)}`));
    for(const m of ev.alarms){
      L.push("BEGIN:VALARM","ACTION:DISPLAY", fold(`DESCRIPTION:${icsEscape(ev.summary)}`), `TRIGGER:-PT${m}M`, "END:VALARM");
    }
    L.push("END:VEVENT");
  }
  L.push("END:VCALENDAR");
  return L.join("\r\n") + "\r\n";
}
function openIcs(list){
  if(!list.length) return;
  const text = buildIcs(list);
  const name = list.length === 1 ? (list[0].title.replace(/[^\w\- ]+/g,"").trim() || "event") + ".ics" : "promemoria.ics";
  const blob = new Blob([text], {type:"text/calendar;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  if(!isIOS) a.download = name; // iPhone opens calendar files directly and shows "Add All"
  a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  // remember what was sent so edits show as "changed"
  for(const it of list){
    const w = items.find(x => x.id === it.id); if(!w) continue;
    const seq = (w.cal && w.cal.seq != null) ? w.cal.seq + 1 : 0;
    w.cal = {sig: eventSig(w), seq, at: Date.now()};
  }
  persist();
  setTimeout(render, 300);
  toast(isIOS ? "Tap “Add All” (or “Add to Calendar”) on the screen that opens." : "Open the downloaded file to add it to your calendar.", 6000);
}

/* ---------- rendering ---------- */
const CHECK_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;

function calChip(it){
  if(calState(it) === "in") return `<span class="chip ok">In Calendar</span>`;
  return it.cal ? `<span class="chip warn">Changed</span>` : `<span class="chip warn">Not in Calendar</span>`;
}
function remRow(it, d){
  const n = d ? daysBetween(today0(), d) : null;
  const dd = d || parseYmd(it.date) || today0();
  const rep = it.repeat && it.repeat !== "none" ? ` · every ${it.repeat.replace("ly","")}` : "";
  return `<button class="row${d?"":" dim"}" data-edit="${esc(it.id)}">
    <div class="when rem"><div class="d num">${dd.getDate()}</div><div class="m">${fmtDate(dd,{month:"short"})}</div></div>
    <div class="main"><div class="t">${esc(it.title)}</div><div class="s num">${fmtDate(dd,{weekday:"long"})}${it.time?` · ${esc(it.time)}`:""}${rep}</div></div>
    <div class="right"><span class="num">${n==null?"past":relDays(n)}</span>${calChip(it)}</div>
  </button>`;
}
function actRow(it, withCheck, date){
  const day = date || today0();
  const key = ymd(day);
  const done = (it.doneDates||[]).includes(key);
  const future = day > today0();
  const left = withCheck
    ? `<button class="check" aria-pressed="${done}" ${future?"disabled":""} aria-label="Mark ${esc(it.title)} done on ${esc(fmtDate(day))}" data-done="${esc(it.id)}" data-date="${key}">${CHECK_SVG}</button>`
    : `<div class="when act"><div class="tm num">${esc(it.start||"")}</div></div>`;
  const daysHtml = `<span class="days">${WEEK_ORDER.map(d=>`<i class="${(it.days||[]).includes(d)?"on":""}">${DOW_LETTER[d]}</i>`).join("")}</span>`;
  const pastOnce = !withCheck && isOnce(it) && (parseYmd(it.date) || today0()) < today0();
  return `<div class="row${pastOnce?" dim":""}">
    ${left}
    <button class="main" data-edit="${esc(it.id)}" style="background:none;border:0;padding:0;text-align:left">
      <div class="t">${esc(it.title)}</div>
      <div class="s num">${esc(timeSpan(it))}${withCheck?"":" · "+esc(schedText(it))}</div>
      ${withCheck || isOnce(it) ?"":`<div style="margin-top:5px">${daysHtml}</div>`}
    </button>
    <div class="right">${withCheck?`<span class="num">${esc(it.start)}</span>`:streakText(it)}${calChip(it)}</div>
  </div>`;
}
function streakText(it){
  const t = today0(); let n = 0, sched = 0;
  if(isOnce(it)){
    const d = parseYmd(it.date) || t;
    return (it.doneDates||[]).includes(it.date) ? `<span>Done</span>` : `<span class="num">${relDays(daysBetween(t, d))}</span>`;
  }
  for(let i=0;i<7;i++){ const d = addDays(t,-i); if(actOn(it,d)){ sched++; if((it.doneDates||[]).includes(ymd(d))) n++; } }
  return `<span class="num">${n}/${sched} this week</span>`;
}
function goalCard(g, compact){
  const s = goalStats(g);
  return `<div class="goal-card">
    <div class="goal-top"><button class="t" data-edit="${esc(g.id)}" style="background:none;border:0;padding:0;text-align:left">${esc(g.title)}</button><span class="chip ${s.status[1]}">${s.status[0]}</span></div>
    <div class="goal-meta num"><span>${fmtLong(s.start)} → <b>${fmtLong(s.end)}</b></span><span>${g.done?"":(s.left>=0?`<b>${s.left}</b> days left`:`${-s.left} days overdue`)}</span></div>
    ${!compact && g.notes ? `<div class="small muted" style="white-space:pre-wrap">${esc(g.notes)}</div>` : ""}
    ${compact?"":`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn sm ${g.done?"ghost":""}" data-goaldone="${esc(g.id)}">${g.done?"Mark as not done":"Mark as achieved"}</button>${calChip(g)}<span class="muted small">Alert: ${esc(alertText(g))}</span></div>`}
  </div>`;
}
function calBanner(){
  const pending = items.filter(it => calState(it) === "pending");
  if(!pending.length) return "";
  const changed = pending.filter(it => it.cal).length;
  return `<div class="banner"><p><b>${pending.length} ${pending.length===1?"item isn't":"items aren't"} in your iPhone Calendar${changed?" (or changed)":""}.</b> Add ${pending.length===1?"it":"them"} so your phone alerts you on time.</p><button class="btn sm" data-act="calall">Add to Calendar</button></div>`;
}
function emptyMsg(kind){
  const msg = {
    reminder:"No reminders yet. Tap + to add an exam, appointment or a friend's birthday.",
    activity:"No activities yet. Tap + to add a daily routine, like a 6:30 run.",
    goal:"No goals yet. Tap + to add one, like saving €5,000 by 1 June.",
    today:"Nothing scheduled for today. Tap + to add something.",
    day:"Nothing planned for this day."
  }[kind];
  return `<div class="empty">${esc(msg)}</div>`;
}

function dayTitle(d){
  const n = daysBetween(today0(), d);
  return n === 0 ? "Today" : n === 1 ? "Tomorrow" : n === -1 ? "Yesterday" : fmtDate(d, {weekday:"long", day:"numeric", month:"long"});
}
function dayBlock(d){
  const acts = items.filter(i => i.type==="activity" && actOn(i,d));
  const rems = items.filter(i => i.type==="reminder" && remOccurrences(i, d, d).length);
  const rows = rems.map(i => ({t: i.time ? mins(i.time) : -1, html: remRow(i,d)}))
    .concat(acts.map(a => ({t: mins(a.start), html: actRow(a,true,d)})))
    .sort((a,b) => a.t - b.t);
  const done = acts.filter(a => (a.doneDates||[]).includes(ymd(d))).length;
  return {html: rows.map(r=>r.html).join(""), count: rows.length, acts: acts.length, done};
}
function pickerBar(){
  const t = ymd(today0());
  const day = `<div class="pick">
      <button class="nav" data-shift="-1" aria-label="Previous day">‹</button>
      <input type="date" id="pickDay" value="${selDay}" aria-label="Pick a day">
      <button class="nav" data-shift="1" aria-label="Next day">›</button>
      ${selDay !== t ? `<button class="btn sm ghost" data-act="gotoday">Today</button>` : ""}
    </div>`;
  const period = `<div class="pick">
      <label class="f">From<input type="date" id="pickFrom" value="${rFrom}"></label>
      <label class="f">To<input type="date" id="pickTo" value="${rTo}"></label>
    </div>`;
  return `<div class="daybar">
    <div class="seg" style="grid-template-columns:1fr 1fr" role="group" aria-label="Show">
      <button type="button" data-dmode="day" aria-pressed="${dmode==="day"}">One day</button>
      <button type="button" data-dmode="period" aria-pressed="${dmode==="period"}">Period</button>
    </div>
    ${dmode === "day" ? day : period}
  </div>`;
}
function viewToday(){
  const t = today0();
  const goals = items.filter(i => i.type==="goal" && !i.done).sort((a,b)=>(a.deadline||"").localeCompare(b.deadline||""));
  let body = "";
  if(dmode === "day"){
    const d = parseYmd(selDay) || t;
    const b = dayBlock(d);
    const isToday = daysBetween(t, d) === 0;
    body = `<section class="sec">
      <div class="sec-head"><h2>${esc(dayTitle(d))}</h2>${b.acts?`<span class="muted small num">${b.done} of ${b.acts} done</span>`:""}</div>
      ${!isToday && Math.abs(daysBetween(t,d)) <= 1 ? `<div class="muted small" style="margin-top:-6px">${esc(fmtDate(d,{weekday:"long", day:"numeric", month:"long"}))}</div>` : ""}
      <div class="list">${b.html || emptyMsg(isToday ? "today" : "day")}</div>
    </section>`;
    if(isToday){
      const upcoming = items.filter(i => i.type==="reminder").map(i => ({i, d: remOccurrences(i, addDays(t,1), addDays(t,30), 1)[0]})).filter(x=>x.d).sort((a,b)=>a.d-b.d).slice(0,8);
      body += `<section class="sec">
        <div class="sec-head"><h2>Next 30 days</h2><button class="link small" data-tab="reminders">All reminders</button></div>
        <div class="list">${upcoming.length ? upcoming.map(x=>remRow(x.i,x.d)).join("") : `<div class="empty">No reminders in the next 30 days.</div>`}</div>
      </section>`;
    }
  } else {
    let a = parseYmd(rFrom) || t, z = parseYmd(rTo) || a;
    if(z < a) [a, z] = [z, a];
    const capped = daysBetween(a, z) > 91;
    if(capped) z = addDays(a, 91);
    const n = daysBetween(a, z) + 1;
    let blocks = "", total = 0;
    for(let d = new Date(a); d <= z; d = addDays(d,1)){
      const b = dayBlock(d);
      if(!b.count) continue;
      total += b.count;
      blocks += `<section class="sec">
        <div class="day-head"><h3>${esc(fmtDate(d,{weekday:"long", day:"numeric", month:"short"}))}</h3><span class="muted small num">${relDays(daysBetween(t,d))}${b.acts?` · ${b.done}/${b.acts} done`:""}</span></div>
        <div class="list">${b.html}</div>
      </section>`;
    }
    body = `<div class="sec-head"><h2>${esc(fmtDate(a,{day:"numeric", month:"short"}))} – ${esc(fmtDate(z,{day:"numeric", month:"short"}))}</h2><span class="muted small num">${n} day${n===1?"":"s"} · ${total} item${total===1?"":"s"}</span></div>
      ${capped ? `<div class="muted small">Showing the first 92 days. Pick a shorter period to see the rest.</div>` : ""}
      ${blocks || `<div class="list"><div class="empty">Nothing planned in this period.</div></div>`}`;
  }
  return `<div class="view">
    ${calBanner()}
    ${pickerBar()}
    ${body}
    <section class="sec">
      <div class="sec-head"><h2>Goals</h2><button class="link small" data-tab="goals">All goals</button></div>
      ${goals.length ? goals.map(g=>goalCard(g,true)).join("") : `<div class="list">${emptyMsg("goal")}</div>`}
    </section>
  </div>`;
}
function viewReminders(){
  const rems = items.filter(i=>i.type==="reminder").map(i=>({i, d: nextRem(i)}));
  const up = rems.filter(x=>x.d).sort((a,b)=>a.d-b.d);
  const past = rems.filter(x=>!x.d).sort((a,b)=>(b.i.date||"").localeCompare(a.i.date||""));
  return `<div class="view">
    ${calBanner()}
    <section class="sec"><div class="sec-head"><h2>Reminders</h2><span class="muted small">Exams, appointments, birthdays</span></div>
      <div class="list">${up.length ? up.map(x=>remRow(x.i,x.d)).join("") : emptyMsg("reminder")}</div>
    </section>
    ${past.length ? `<section class="sec"><h3>Past</h3><div class="list">${past.map(x=>remRow(x.i,null)).join("")}</div></section>` : ""}
  </div>`;
}
function viewActivities(){
  const t0 = today0();
  const pastOnce = a => isOnce(a) && (parseYmd(a.date) || t0) < t0;
  const acts = items.filter(i=>i.type==="activity").sort((a,b)=>(pastOnce(a)-pastOnce(b)) || (isOnce(a)-isOnce(b)) || (isOnce(a) && (a.date||"").localeCompare(b.date||"")) || (mins(a.start)-mins(b.start)));
  const weekly = acts.reduce((s,a)=>s + durMin(a)*(a.days||[]).length, 0);
  return `<div class="view">
    ${calBanner()}
    <section class="sec"><div class="sec-head"><h2>Activities</h2>${weekly?`<span class="muted small num">${(weekly/60).toFixed(1)} h planned per week</span>`:""}</div>
      <div class="list">${acts.length ? acts.map(a=>actRow(a,false)).join("") : emptyMsg("activity")}</div>
      <p class="muted small">Tick activities off on the Today tab. Your Report shows how often you kept to them.</p>
    </section>
  </div>`;
}
function viewGoals(){
  const goals = items.filter(i=>i.type==="goal").sort((a,b)=>(a.done?1:0)-(b.done?1:0) || (a.deadline||"").localeCompare(b.deadline||""));
  return `<div class="view">
    ${calBanner()}
    <section class="sec"><div class="sec-head"><h2>Goals</h2><span class="muted small">What you want to reach, and by when</span></div>
      ${goals.length ? goals.map(g=>goalCard(g,false)).join("") : `<div class="list">${emptyMsg("goal")}</div>`}
    </section>
  </div>`;
}
function viewReport(){
  const t = today0();
  const N = report.days;
  const showR = report.type==="all" || report.type==="reminder";
  const showA = report.type==="all" || report.type==="activity";
  const showG = report.type==="all" || report.type==="goal";
  const to = N ? addDays(t, N) : null;
  const from = N ? addDays(t, -(N-1)) : null;

  const remRows = items.filter(i=>i.type==="reminder").flatMap(i => remOccurrences(i, t, to || addDays(t,365), 60).map(d=>({i,d}))).sort((a,b)=>a.d-b.d);
  const acts = items.filter(i=>i.type==="activity").sort((a,b)=>mins(a.start)-mins(b.start));
  const goals = items.filter(i=>i.type==="goal").sort((a,b)=>(a.deadline||"").localeCompare(b.deadline||""));
  const weekly = acts.reduce((s,a)=>s + durMin(a)*(a.days||[]).length, 0);

  function actStats(a){
    const created = parseYmd(a.created) || t;
    const start = from && from > created ? from : created;
    let sched = 0, done = 0;
    const doneSet = new Set(a.doneDates||[]);
    for(let d = new Date(start); d <= t; d = addDays(d,1)){ if(actOn(a,d)){ sched++; if(doneSet.has(ymd(d))) done++; } }
    return {sched, done, pct: sched ? done/sched : 0};
  }
  const typeLabel = {all:"Everything", reminder:"Reminders", activity:"Activities", goal:"Goals"}[report.type];
  const periodLabel = report.type==="goal" ? "All goals" : (N ? `${N} days` : "All time");

  const remTable = `<section class="sec"><div class="sec-head"><h3>Reminders · ${N?`next ${N} days`:"next 12 months"}</h3><span class="chip rem num">${remRows.length}</span></div>
    ${remRows.length ? `<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Reminder</th><th>Alert</th></tr></thead><tbody>
      ${remRows.map(({i,d})=>`<tr><td class="num" style="white-space:nowrap">${fmtDate(d)} ${d.getFullYear()!==t.getFullYear()?d.getFullYear():""}<br><span class="muted">${i.time?esc(i.time):"all day"} · ${relDays(daysBetween(t,d))}</span></td><td><span class="t">${esc(i.title)}</span>${i.repeat&&i.repeat!=="none"?`<br><span class="muted">repeats ${esc(i.repeat)}</span>`:""}</td><td class="muted">${esc(alertText(i))}</td></tr>`).join("")}
    </tbody></table></div>` : `<div class="muted small">Nothing in this period.</div>`}</section>`;

  const actTable = `<section class="sec"><div class="sec-head"><h3>Activities · ${N?`last ${N} days`:"since added"}</h3><span class="chip act num">${(weekly/60).toFixed(1)} h/week</span></div>
    ${acts.length ? `<div class="tbl-wrap"><table><thead><tr><th>Activity</th><th>When</th><th>Kept</th></tr></thead><tbody>
      ${acts.map(a=>{ const s = actStats(a); return `<tr><td><span class="t">${esc(a.title)}</span></td><td class="num">${esc(timeSpan(a))}<br><span class="muted">${esc(schedText(a))}</span></td><td class="num" style="white-space:nowrap">${s.done}/${s.sched} <span class="muted">(${Math.round(s.pct*100)}%)</span><div class="minibar"><span style="width:${(s.pct*100).toFixed(0)}%"></span></div></td></tr>`; }).join("")}
    </tbody></table></div>` : `<div class="muted small">No activities.</div>`}</section>`;

  const goalTable = `<section class="sec"><div class="sec-head"><h3>Goals · all</h3><span class="chip goal num">${goals.length}</span></div>
    ${goals.length ? `<div class="tbl-wrap"><table><thead><tr><th>Goal</th><th>Period</th><th>Status</th></tr></thead><tbody>
      ${goals.map(g=>{ const s = goalStats(g); return `<tr><td><span class="t">${esc(g.title)}</span></td><td class="num">${fmtLong(s.start)} →<br>${fmtLong(s.end)}</td><td class="num"><span class="chip ${s.status[1]}">${s.status[0]}</span>${g.done?"":`<br><span class="muted">${s.left>=0?`${s.left} days left`:`${-s.left} days overdue`}</span>`}</td></tr>`; }).join("")}
    </tbody></table></div>` : `<div class="muted small">No goals.</div>`}</section>`;

  const typeBtns = [["all","All"],["reminder","Reminders"],["activity","Activities"],["goal","Goals"]].map(([k,l])=>`<button aria-pressed="${report.type===k}" data-rtype="${k}">${l}</button>`).join("");
  const dayBtns = [[7,"7 days"],[30,"30 days"],[90,"90 days"],[0,"All"]].map(([k,l])=>`<button aria-pressed="${report.days===k}" data-rdays="${k}">${l}</button>`).join("");
  const open = goals.filter(g=>!g.done).length;

  return `<div class="view">
    <div class="filters">
      <h2>Report</h2>
      <div class="toggles" role="group" aria-label="Show">${typeBtns}</div>
      ${report.type==="goal" ? "" : `<div class="toggles" role="group" aria-label="Period">${dayBtns}</div>`}
    </div>
    <article class="report" aria-label="Report">
      <div class="report-head">
        <div><div class="brand">Promemoria report</div><div class="ttl">${esc(typeLabel)}</div></div>
        <div class="muted small num" style="text-align:right">${esc(periodLabel)}<br>${fmtLong(t)}</div>
      </div>
      <div class="sum num">
        ${showR?`<span class="chip rem">${remRows.length} upcoming reminder${remRows.length===1?"":"s"}</span>`:""}
        ${showA?`<span class="chip act">${acts.length} activit${acts.length===1?"y":"ies"}</span>`:""}
        ${showG?`<span class="chip goal">${open} open goal${open===1?"":"s"}</span>`:""}
      </div>
      ${showR?remTable:""}${showA?actTable:""}${showG?goalTable:""}
    </article>
    <p class="muted small">To save or share this report, take a screenshot.</p>
    <section class="backup">
      <h2>Backup</h2>
      <p class="muted small">Your items are saved only on this phone. Copy a backup now and then, and keep it in Notes, so you can restore it on a new phone.</p>
      <div class="grp"><button class="btn sm" data-act="copybackup">Copy backup</button><button class="btn sm ghost" data-act="showrestore">Restore from backup</button></div>
      <div id="restoreBox" class="sec" hidden>
        <label class="f">Paste your backup text or import link here<textarea id="restoreText" placeholder="https://…#import=…  or  [{&quot;type&quot;:&quot;reminder&quot;, …}]"></textarea></label>
        <div><button class="btn sm" data-act="restore">Restore</button></div>
      </div>
    </section>
  </div>`;
}

function render(){
  const v = {today:viewToday, reminders:viewReminders, activities:viewActivities, goals:viewGoals, report:viewReport}[view] || viewToday;
  $("#main").innerHTML = v();
  document.querySelectorAll(".tabs [data-tab]").forEach(b => b.setAttribute("aria-current", b.dataset.tab === view ? "page" : "false"));
  $("#fab").hidden = view === "report";
  $("#todayLine").textContent = fmtDate(new Date(), {weekday:"long", day:"numeric", month:"long"});
  $("#status").innerHTML = storageOk ? "<b></b>Saved on this phone" : "<b style='background:var(--bad)'></b>Not saving";
}
function go(v){
  view = v; render(); window.scrollTo(0,0);
  try { history.replaceState(null, "", "#"+v); } catch(e){}
}

/* ---------- editor sheet ---------- */
let edit = null;
let delArmed = false;

function openSheet(it, type){
  const t = ymd(today0());
  edit = it ? clone(it) : {
    id: uid(), type: type || "reminder", title:"", notes:"", created: t,
    date: t, time:"", repeat:"none",
    start:"07:00", end:"", days:[], doneDates:[],
    deadline:"", done:false, alerts:null
  };
  edit.start_g = (it && edit.type === "goal") ? (edit.start || t) : t;
  if(edit.alerts == null) edit.alerts = defaultAlerts(edit);
  delArmed = false;
  $("#sheetTitle").textContent = it ? `Edit ${TYPE[edit.type].label.toLowerCase()}` : "New item";
  $("#delBtn").hidden = !it;
  $("#delBtn").textContent = "Delete"; $("#delBtn").className = "btn ghost";
  $("#formErr").hidden = true;
  $("#fTitle").value = edit.title || "";
  $("#fNotes").value = edit.notes || "";
  $("#fDate").value = edit.date || t;
  $("#fTime").value = edit.time || "";
  $("#fRepeat").value = edit.repeat || "none";
  $("#fStart").value = edit.type==="activity" ? (edit.start||"07:00") : "07:00";
  $("#fEnd").value = edit.type==="activity" ? (edit.end||"") : "";
  if(!Array.isArray(edit.days)) edit.days = [];
  $("#fActDate").value = (edit.type==="activity" && edit.date) ? edit.date : (dmode === "day" && view === "today" ? selDay : t);
  $("#fGStart").value = edit.start_g;
  $("#fDeadline").value = edit.deadline || "";
  $("#typeSeg").querySelectorAll("button").forEach(b => b.disabled = !!it && b.dataset.type !== edit.type);
  edit._ad = currentAllDay();
  paintType(); paintDays(); paintAlerts();
  const cb = $("#calBox");
  if(it){
    cb.hidden = false;
    const st = calState(it);
    $("#calText").textContent = st === "in" ? "This is in your iPhone Calendar with its alerts. Tap again if it's missing there." : it.cal ? "You changed this item. Add it again to update your Calendar." : "Add this to your iPhone Calendar to get its alerts.";
  } else cb.hidden = true;
  $("#backdrop").hidden = false;
}
function defaultAlerts(it){
  if(it.type === "goal") return [7];
  if(it.type === "activity") return [10];
  return it.time ? [1440, 60] : [1];
}
function paintType(){
  $("#typeSeg").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.type === edit.type));
  $("#fsReminder").hidden = edit.type !== "reminder";
  $("#fsActivity").hidden = edit.type !== "activity";
  $("#fsGoal").hidden = edit.type !== "goal";
}
function paintDays(){
  $("#fDays").innerHTML = WEEK_ORDER.map(d => `<button type="button" data-day="${d}" aria-pressed="${edit.days.includes(d)}">${DOW_SHORT[d]}</button>`).join("")
    + `<button type="button" data-day="all" aria-pressed="false">Every day</button>`;
  $("#fActDateWrap").hidden = edit.days.length > 0;
}
function currentAllDay(){ return edit.type === "goal" || (edit.type === "reminder" && !$("#fTime").value); }
function paintAlerts(){
  const allDay = currentAllDay();
  const src = allDay ? DAY_ALERTS : (edit.type === "activity" ? TIMED_ALERTS.slice(0,7) : TIMED_ALERTS);
  const valid = new Set(src.map(x=>x[0]));
  edit.alerts = edit.alerts.filter(v => valid.has(v));
  $("#alertsLabel").textContent = allDay ? "Alert me (at 9:00, this many days before)" : "Alert me before it starts";
  $("#fAlerts").innerHTML = src.map(([v,l]) => `<button type="button" data-alert="${v}" aria-pressed="${edit.alerts.includes(v)}">${l}</button>`).join("");
}
function closeSheet(){ $("#backdrop").hidden = true; edit = null; render(); }

function readForm(){
  const e = clone(edit);
  e.title = $("#fTitle").value.trim();
  e.notes = $("#fNotes").value.trim();
  if(e.type === "reminder"){
    e.date = $("#fDate").value; e.time = $("#fTime").value; e.repeat = $("#fRepeat").value;
    if(!e.date) return [null, "Pick a date."];
  } else if(e.type === "activity"){
    e.start = $("#fStart").value; e.end = $("#fEnd").value;
    if(!e.start) return [null, "Pick a start time."];
    if(!e.days.length){
      e.date = $("#fActDate").value;
      if(!e.date) return [null, "Pick a date for this one-time activity."];
    } else e.date = "";
    if(e.end && mins(e.end) <= mins(e.start)) return [null, "The end time must be after the start time."];
  } else {
    e.start = $("#fGStart").value; e.deadline = $("#fDeadline").value;
    if(!e.deadline) return [null, "Pick a deadline."];
    if(e.start && e.deadline < e.start) return [null, "The deadline must be after the start date."];
  }
  if(!e.title) return [null, "Give it a title."];
  const keep = {reminder:["date","time","repeat"], activity:["start","end","days","date","doneDates"], goal:["start","deadline","done"]}[e.type];
  const out = {id:e.id, type:e.type, title:e.title, notes:e.notes, alerts:e.alerts.slice().sort((a,b)=>b-a), created:e.created, cal:e.cal||null};
  keep.forEach(k => out[k] = e[k] ?? (k==="doneDates" ? [] : k==="done" ? false : ""));
  return [out, null];
}
function onSave(ev){
  ev.preventDefault();
  const [it, err] = readForm();
  if(err){ const el = $("#formErr"); el.textContent = err; el.hidden = false; return; }
  closeSheet();
  putItem(it);
  toast(calState(it) === "in" ? "Saved" : "Saved. Tap “Add to Calendar” at the top to get alerts.", 4500);
}
function onDelete(){
  if(!delArmed){
    delArmed = true;
    const b = $("#delBtn"); b.textContent = "Tap again to delete"; b.className = "btn danger";
    setTimeout(()=>{ if(edit && delArmed){ delArmed = false; b.textContent = "Delete"; b.className = "btn ghost"; } }, 4000);
    return;
  }
  const it = items.find(x => x.id === edit.id);
  closeSheet();
  if(!it) return;
  dropItem(it.id);
  toast(it.cal ? `Deleted. Also delete “${it.title}” in the Calendar app.` : "Deleted", 6000);
}

/* ---------- backup ---------- */
function copyBackup(){
  const text = JSON.stringify(items);
  const fallback = () => { $("#restoreBox").hidden = false; const ta = $("#restoreText"); ta.value = text; ta.focus(); ta.select(); toast("Select all and copy this text, then keep it in Notes.", 6000); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => toast("Backup copied. Paste it into Notes to keep it safe.", 5000), fallback);
  } else fallback();
}
function mergeItems(list){
  if(!Array.isArray(list)) throw new Error("not a list");
  let added = 0, updated = 0;
  for(const raw of list){
    if(!raw || typeof raw !== "object" || !raw.id || !["reminder","activity","goal"].includes(raw.type) || !raw.title) continue;
    const i = items.findIndex(x => x.id === raw.id);
    if(i >= 0){ items[i] = raw; updated++; } else { items.push(raw); added++; }
  }
  persist(); render();
  return {added, updated};
}
function decodeImport(code){
  let b64 = code.trim().replace(/-/g,"+").replace(/_/g,"/"); while(b64.length % 4) b64 += "=";
  return JSON.parse(decodeURIComponent(Array.prototype.map.call(atob(b64), c => "%" + c.charCodeAt(0).toString(16).padStart(2,"0")).join("")));
}
function restore(){
  try {
    const raw = $("#restoreText").value.trim();
    const link = raw.match(/#import=([A-Za-z0-9_\-]+)/);
    const r = mergeItems(link ? decodeImport(link[1]) : JSON.parse(raw));
    toast(`Restored: ${r.added} new, ${r.updated} updated.`);
  } catch(e){ toast("That text isn't a Promemoria backup. Copy the whole backup and try again.", 5000); }
}
function importFromHash(){
  const m = location.hash.match(/^#import=(.+)$/);
  if(!m) return false;
  try {
    const r = mergeItems(decodeImport(m[1]));
    setTimeout(() => toast(`Loaded ${r.added + r.updated} items into Promemoria.`, 5000), 300);
  } catch(e){ setTimeout(() => toast("This import link is broken. Ask for a new one.", 5000), 300); }
  try { history.replaceState(null, "", location.pathname + "#today"); } catch(e){ location.hash = "today"; }
  return true;
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-tab],[data-edit],[data-done],[data-goaldone],[data-act],[data-rtype],[data-rdays],[data-type],[data-day],[data-alert],[data-dmode],[data-shift]");
  if(!el) return;
  const d = el.dataset;
  if(d.tab){ go(d.tab); return; }
  if(d.edit){ const it = items.find(x=>x.id===d.edit); if(it) openSheet(it); return; }
  if(d.done){
    const it = items.find(x=>x.id===d.done); if(!it) return;
    const w = clone(it); const t = d.date || ymd(today0());
    const set = new Set(w.doneDates||[]); set.has(t) ? set.delete(t) : set.add(t);
    w.doneDates = [...set].sort().slice(-400);
    putItem(w); return;
  }
  if(d.dmode){ dmode = d.dmode; render(); return; }
  if(d.shift){ selDay = ymd(addDays(parseYmd(selDay) || today0(), Number(d.shift))); render(); return; }
  if(d.goaldone){ const it = items.find(x=>x.id===d.goaldone); if(!it) return; const w = clone(it); w.done = !w.done; putItem(w); if(w.done) toast("Goal achieved. Well done!"); return; }
  if(d.rtype){ report.type = d.rtype; try{ localStorage.setItem("promemoria.report", JSON.stringify(report)); }catch(_){} render(); return; }
  if(d.rdays !== undefined){ report.days = Number(d.rdays); try{ localStorage.setItem("promemoria.report", JSON.stringify(report)); }catch(_){} render(); return; }
  if(d.type && edit){ edit.type = d.type; edit.alerts = defaultAlerts({type:edit.type, time:$("#fTime").value}); edit._ad = currentAllDay(); paintType(); paintAlerts(); return; }
  if(d.day && edit){
    if(d.day === "all") edit.days = [0,1,2,3,4,5,6];
    else { const n = Number(d.day); edit.days = edit.days.includes(n) ? edit.days.filter(x=>x!==n) : edit.days.concat(n); }
    paintDays(); return;
  }
  if(d.alert && edit){ const n = Number(d.alert); edit.alerts = edit.alerts.includes(n) ? edit.alerts.filter(x=>x!==n) : edit.alerts.concat(n); paintAlerts(); return; }
  switch(d.act){
    case "new": { const map = {reminders:"reminder", activities:"activity", goals:"goal"}; openSheet(null, map[view] || "reminder"); return; }
    case "close": closeSheet(); return;
    case "delete": onDelete(); return;
    case "gotoday": selDay = ymd(today0()); render(); return;
    case "calall": openIcs(items.filter(it => calState(it) === "pending")); return;
    case "calone": {
      const [it, err] = readForm();
      if(err){ const el = $("#formErr"); el.textContent = err; el.hidden = false; return; }
      putItem(it); closeSheet(); openIcs([it]); return;
    }
    case "copybackup": copyBackup(); return;
    case "showrestore": { const b = $("#restoreBox"); b.hidden = !b.hidden; return; }
    case "restore": restore(); return;
  }
});
$("#sheet").addEventListener("submit", onSave);
document.addEventListener("change", e => {
  const id = e.target.id, v = e.target.value;
  if(!v) return;
  if(id === "pickDay"){ selDay = v; render(); }
  else if(id === "pickFrom"){ rFrom = v; if(rTo < rFrom) rTo = rFrom; render(); }
  else if(id === "pickTo"){ rTo = v; render(); }
});
$("#backdrop").addEventListener("click", e => { if(e.target.id === "backdrop") closeSheet(); });
document.addEventListener("keydown", e => { if(e.key === "Escape" && edit) closeSheet(); });
$("#fTime").addEventListener("input", () => { if(!edit) return; const now = currentAllDay(); if(edit._ad !== now){ edit.alerts = defaultAlerts({type:edit.type, time:$("#fTime").value}); edit._ad = now; } paintAlerts(); });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if(VIEWS.includes(h) && h !== view){ view = h; render(); } });
// refresh "today" after midnight or when coming back to the app
document.addEventListener("visibilitychange", () => { if(!document.hidden && !edit) render(); });

/* ---------- boot ---------- */
load();
const imported = importFromHash();
const h = location.hash.slice(1);
if(!imported && VIEWS.includes(h)) view = h;
render();
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
</body>
</html>
